name: Attempt Mystic GSI download (research)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/attempt-gsi.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Show runner limits
        run: |
          echo "=== Runner environment ==="
          free -h
          df -h
          nproc
          uname -a
          echo "GitHub Actions runners typically have limited free disk (~14-30 GB) and cannot sustainably unpack 6-9 GiB system images + apply patches + keep artifacts."

      - name: Try HEAD request on known Mystic pa3q file
        run: |
          URL="https://sourceforge.net/projects/mystic-gsi-updates/files/OneUI/Oneui-pa3q-16-S938BXXU7ZYKR-AB-20251201-MysticGSI.zip/download"
          echo "Probing: $URL"
          curl -sIL --max-time 60 "$URL" | tee headers.txt || true
          grep -iE 'HTTP/|content-length|content-type|location|content-disposition' headers.txt || true

      - name: Explicit status
        run: |
          cat << 'EOF'
          ============================================
          RESULT OF THIS WORKFLOW
          ============================================
          - This job only probes size and runner capacity.
          - It does NOT produce a bootable One UI 8 image for Redmi 9T.
          - It does NOT apply Nekover2 patches (those are build-specific).
          - It does NOT test on any physical device.
          - Classification remains:
              NO GENUINE S25 ULTRA ONE UI 8 PORT PRODUCED
              NO DSU-BOOTABLE PACKAGE PRODUCED
              NO INSTALLABLE ROM PRODUCED
          ============================================
          EOF

      - name: Upload probe logs
        uses: actions/upload-artifact@v4
        with:
          name: probe-logs
          path: headers.txt
          if-no-files-found: ignore
